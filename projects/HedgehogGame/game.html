<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>build_src</title>

    <link rel="icon" type="image/png" href="favicon2.png" sizes="16x16">

    <!-- PyScript/Pygbag main script -->
    <script src="https://pygame-web.github.io/cdn/0.9.3/pythons.js" type="module" id="site" data-python="python3.12"
        data-LINES=42 data-COLUMNS=132 data-os="vtx,snd,gui" async defer>
        #<!-- Python script embedded directly in the HTML -->
        import sys
        import asyncio
        import platform
        import json
        from pathlib import Path

        # Pygbag configuration from JS global `config`
        PyConfig = platform.window.config.to_dict()

        print("""
Loading build_src from build_src.apk
    Pygbag Version : 0.9.3
    Template Version : 0.9.3
    Python  : 3.12
    CDN URL : https://pygame-web.github.io/cdn/0.9.3/
    Screen  : 1280x720
    Title   : build_src
    Folder  : build_src
    Authors : pgw
    SPDX-License-Identifier: cookiecutter.spdx
""")

        async def custom_site():
            import embed
            platform.document.body.style.background = "transparent"

            platform.window.transfer.hidden = True # Use 'True' for Python boolean
            platform.window.canvas.style.visibility = "visible"

            bundle = PyConfig.get("archive", "build_src") # Get from PyConfig if available
            appdir = Path(f"/data/data/{bundle}")
            appdir.mkdir(exist_ok=True) # Add exist_ok to prevent error if already exists

            # Unpack filesystem from compressed archive into work dir
            if platform.window.location.host.find('.itch.zone') > 0:
                import zipfile
                async with platform.fopen(f"{bundle}.apk", "rb") as archive: # Use bundle for filename
                    with zipfile.ZipFile(archive) as zip_ref:
                        zip_ref.extractall(appdir.as_posix())
            else:
                import tarfile
                async with platform.fopen(f"{bundle}.tar.gz", "rb") as archive: # Use bundle for filename
                    tar = tarfile.open(fileobj=archive, mode="r:gz")
                    tar.extractall(path=appdir.as_posix(), filter='tar')
                    tar.close()

            platform.run_main(PyConfig, loaderhome=appdir / "assets", loadermain=None)

            while embed.counter() < 0:
                await asyncio.sleep(.1)

            main_py_path = appdir / "assets" / "main.py"

            # Skip UME wait if autorun is enabled
            # Note: `config` is not defined here, assume `PyConfig`
            if not platform.window.MM.UME and not PyConfig.get("autorun"):
                __import__(__name__).__file__ = main_py_path.as_posix() # Ensure path is a string
                msg = "Ready to start ! Please click/touch page"
                platform.window.infobox.innerText = msg
                while not platform.window.MM.UME:
                    await asyncio.sleep(.1)

            # Ensure `TopLevel_async_handler` and `shell` are accessible (they should be from pygbag runtime)
            await TopLevel_async_handler.start_toplevel(platform.shell, console=platform.window.python.config.debug)

            __import__(__name__).__file__ = main_py_path.as_posix() # Ensure path is a string

            def ui_callback(pkg):
                platform.window.infobox.innerText = f"installing {pkg}"

            # Ensure `shell` is accessible
            await platform.shell.source(main_py_path, callback=ui_callback)

            platform.window.infobox.style.display = "none"
            platform.window.config.gui_divider = 1 # Update JS config directly
            platform.window.window_resize()
            print("default.tmpl: done")

            platform.shell.interactive() # Use platform.shell explicitly

        asyncio.run(custom_site())
        # -->
    </script>

    <!-- JavaScript Configuration and Utility Functions -->
    <script type="application/javascript">
        // This dict is available under window.config and then PyConfig.config from __main__
        const config = {
            xtermjs: "1",
            _sdl2: "canvas",
            user_canvas: 0,
            user_canvas_managed: 0,
            gui_divider: 2,
            ume_block: 0,
            can_close: 0,
            archive: "build_src",
            gui_debug: 2,
            cdn: "https://pygame-web.github.io/cdn/0.9.3/",
            autorun: 1,
            PYBUILD: "3.12",
            fb_ar: 1.77,
            fb_width: "1280",
            fb_height: "720"
        };

        // Make config globally accessible for pygbag
        window.config = config;

        function show_infobox() {
            const infobox = document.getElementById("infobox");
            if (infobox) { // Check if element exists
                infobox.style.display = "block";

                // Box measure
                const w = infobox.offsetWidth;
                const h = infobox.offsetHeight;

                // Center in viewport
                const left = (window.innerWidth - w) / 2;
                const top = (window.innerHeight - h) / 2;

                infobox.style.left = left + "px";
                infobox.style.top = top + "px";
            }
        }
    </script>

    <!-- BrowserFS for file system (if used by pygbag internally) -->
    <script src="https://pygame-web.github.io/cdn/0.9.3//browserfs.min.js"></script>
</head>

<body>
    <div id="transfer" align="center">
        <!-- <div class="spinner" id='spinner'></div> -->
        <div class="emscripten" id="status">Downloading...</div>
        <div class="emscripten">
            <progress value="0" max="100" id="progress"></progress>
        </div>
    </div>

    <canvas class="emscripten" id="canvas" width="1px" height="1px" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
    <canvas class="emscripten" id="canvas3d" width="1280px" height="720px" oncontextmenu="event.preventDefault()" tabindex="1" hidden></canvas>

    <div id="infobox">Loading, please wait ...</div>

    <div id="html"></div>

    <div id="crt" class="bottomright">
        <div id="system" hidden>
            <div class="button-container">
                <button id="aiostop" disabled>AIO ⏏︎</button>
                <button id="aiopaused_true" disabled>AIO ■</button>
                <button id="aiopaused_false" disabled>AIO ▶</button>
                <button id="pygame_mixer_music_pause" disabled>Music ■</button>
            </div>

            <div class="button-container">
                <div id="load_min">min</div>
                <div id="load_avg">avg</div>
                <div id="load_max">max</div>
                <button id="load_rst" disabled>RESET</button>
            </div>

            <div id="level">(battery level unknown)</div>
            <div id="stateBattery">(charging state unknown)</div>
        </div>

        <div id="box" class="emscripten_border" hidden="true">
            <div id="info" class="trinfo"></div>
            <iframe id="iframe" class="framed" name="iframe" width="470px" height="90%" allowtransparency="true"
                style="z-index: 10; background: #FFFFFF;" frameborder="1" allowfullscreen="true"
                webkitallowfullscreen="true" msallowfullscreen="true" mozallowfullscreen="true"
                sandbox="allow-same-origin allow-top-navigation allow-scripts allow-pointer-lock"
                allow="autoplay; fullscreen *; geolocation; microphone; camera; midi; monetization; xr-spatial-tracking; gamepad; gyroscope; accelerometer; xr; cross-origin-isolated"
                src="https://pygame-web.github.io/cdn/0.9.3/empty.html" scrolling="yes">
            </iframe>
        </div>
    </div>

    <div id="dlg" hidden>
        <input type="file" id="dlg_multifile" multiple accept="image/*">
        <label for="dlg_multifile">Select files</label>
    </div>

    <div id="pyconsole">
        <div id="terminal" tabIndex="1" align="left"></div>
    </div>

    <script type="application/javascript">
        globalThis.__canvas_resized = (self, ecw, ech) => {
            console.warn("TODO: panda3d canvas monitor", self, ecw, ech)
        }

        // Renamed to avoid conflicts and improve clarity, if pygbag doesn't strictly need `custom_onload` specifically.
        // If pygbag runtime expects `custom_onload`, revert this.
        async function initializePygbagUI(debug_hidden) {
            console.log("initializePygbagUI", "custom_onload") // Use a more descriptive string

            // Get elements after DOM is loaded
            const pyconsole = document.getElementById("pyconsole");
            const system = document.getElementById("system");
            const transfer = document.getElementById("transfer");
            const info = document.getElementById("info");
            const box = document.getElementById("box");

            if (pyconsole) pyconsole.hidden = debug_hidden;
            if (system) system.hidden = debug_hidden;
            if (transfer) transfer.hidden = debug_hidden;
            if (info) info.hidden = debug_hidden;
            if (box) box.hidden = debug_hidden;

            show_infobox();
        }

        function custom_prerun() {
            // no python main and no (MEMFS + VFS) yet.
            console.log("custom_prerun", "custom_prerun") // Consistent logging
        }

        function custom_postrun() {
            // python main and no VFS filesystem yet.
            console.log("custom_postrun", "custom_postrun") // Consistent logging
        }

        function debug() {
            if (window.python && window.python.config) { // Check if python config exists
                window.python.config.debug = true;
            } else {
                console.warn("Python config not available yet.");
            }
            initializePygbagUI(false); // Call the new initialization function
            // Module.PyRun_SimpleString("shell.uptime()") // This typically needs to run after python is fully loaded
            // window_resize() // Ensure window_resize is defined globally or called from pygbag's context
            if (typeof window.window_resize === 'function') {
                window.window_resize();
            } else {
                console.warn("window_resize function not found.");
            }
        }

        function info_inline(data) {
            const infoElement = document.getElementById("info");
            if (infoElement) {
                infoElement.innerHTML = data;
            }
        }

        function info_online(url) {
            // APK
            fetch(url /*, options */)
                .then((response) => response.text())
                .then((html) => {
                    info_inline(html);
                })
                .catch((error) => {
                    console.warn("Error fetching info_online:", error);
                });
        }

        function frame_online(url) {
            const iframe = window.frames["iframe"];
            if (iframe) {
                iframe.location = url;
            } else {
                console.warn("Iframe with name 'iframe' not found.");
            }
        }

        // Call the initial UI setup when the document is ready
        document.addEventListener('DOMContentLoaded', () => {
            initializePygbagUI(true); // Start with debug hidden by default
        });

    </script>
</body>
</html>
